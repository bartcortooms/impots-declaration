<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Déclaration {{ year }} — impots-declaration</title>
  <style>{{ inline_css | safe }}</style>
  <script>{{ inline_js | safe }}</script>
</head>
<body>
<main>
  <div class="app-topbar">
    <span class="app-title">📑 Déclaration&nbsp;{{ year }}</span>
    <div class="legend" aria-label="Légende des couleurs">
      <span class="legend-item"><span class="legend-swatch computed"></span> à reporter</span>
      <span class="legend-item"><span class="legend-swatch formula"></span> calculé par le formulaire</span>
      <span class="legend-item"><span class="legend-swatch empty"></span> non applicable</span>
    </div>
    <span class="kbd-hint" title="Raccourcis clavier — utilisables partout sauf dans un champ de saisie">
      <span class="kbd-icon" aria-hidden="true">⌨</span>
      <span class="kbd-label">Raccourcis</span>
      <kbd>←</kbd> <kbd>→</kbd> &nbsp;·&nbsp; <kbd>1</kbd>…<kbd>0</kbd>
    </span>
  </div>

  {% block content %}{% endblock %}

  <footer class="app-footer">
    <span>Généré par <code>impots-declaration</code></span>
    <span class="footer-sep">·</span>
    <span>FX rates : {{ fx_source }}</span>
  </footer>
</main>
</body>
</html>

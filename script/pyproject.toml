[project]
name = "impots-declaration"
version = "0.1.0"
description = "Build French tax declaration inputs from foreign-broker stock statements"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pdfplumber>=0.11.9",
    "requests>=2.34.1",
]

[project.scripts]
build-declaration = "impots.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

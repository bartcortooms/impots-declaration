                      - row "Lorsque la convention fiscale prévoit l'élimination de la double imposition par un crédit d'impôt égal à l'impôt étranger, indiquez le montant des revenus perçus (après déduction de l'impôt supporté à l'étranger), le taux applicable indiqué dans la notice et le montant de l'impôt supporté à l'étranger. Le crédit d'impôt à retenir est égal au montant de l'impôt supporté à l'étranger sauf lorsque le produit du montant net du revenu par le taux applicable est inférieur. Dans ce cas, il convient de retenir ce dernier montant (suivre lignes 203 à 208 ou 233 à 238, selon le cas)." [ref=e91]:
